<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1410">
<title>21 Helper</title>
<style>
  :root {
    --bg:#0b1410; --felt:#12211a; --panel:#18281f; --panel2:#1f3328; --line:#2c4336; --ink:#f1f6f2; --dim:#8ea69a;
    --go:#56e08a; --warn:#ffb84d; --bad:#ff6b5e; --gold:#f2cf6b; --card:#fbf8ef; --cardink:#17201b;
    --ch:clamp(36px, 5.6vh, 50px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; touch-action:manipulation; }
  body { display:flex; flex-direction:column; min-height:100dvh; max-width:560px; margin:0 auto; padding:calc(6px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)); user-select:none; -webkit-user-select:none;
    background:radial-gradient(120% 60% at 50% 0%, #16291f 0%, var(--bg) 70%); }
  button, input, select { font-family:inherit; }
  #game { display:flex; flex-direction:column; flex:1 1 auto; gap:7px; min-height:0; }
  #lobby { padding:6px 2px 24px; }
  body.inlobby #game { display:none; } body:not(.inlobby) #lobby { display:none; }
  .lobhead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 2px 12px; }
  .lobhead h1 { margin:0; font-size:26px; letter-spacing:-.01em; } .lobsub { color:var(--dim); font-size:13px; margin-top:2px; }
  .lobrec { text-align:right; font-variant-numeric:tabular-nums; } .lobrec .wl { display:block; font-size:30px; white-space:nowrap; font-weight:800; line-height:1.1; } .lobrec .wl i { font-style:normal; color:var(--dim); font-weight:500; }
  .lobmid { font-size:13px; color:var(--dim); margin:-6px 2px 10px; font-variant-numeric:tabular-nums; } .lobmid b { color:var(--ink); font-weight:600; }
  .lobmsg { background:#17432a; border:1px solid #2a6b45; color:var(--go); border-radius:12px; padding:9px 12px; font-size:14px; font-weight:600; margin-bottom:8px; }
  .lobmsg.loss { background:#45201c; border-color:#70332d; color:var(--bad); }
  .enter { width:100%; height:64px; border:0; border-radius:16px; background:linear-gradient(180deg,#6cf09c,#3fc873); color:#06210f; font-size:22px; font-weight:800; letter-spacing:.02em; box-shadow:0 4px 0 #1f7f45; margin:2px 0 4px; }
  .enter:active { transform:translateY(3px); box-shadow:0 1px 0 #1f7f45; }
  #lobby h3 { margin:20px 2px 8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  #lobby .tile, #lobby .grow, #lobby .srow, #lobby .tiers button, #lobby .field input, #lobby .field select { background:var(--panel); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:5px 4px 4px; text-align:center; }
  .stat b { display:block; font-size:21px; font-variant-numeric:tabular-nums; line-height:1.15; }
  .stat span { font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); }
  .stat.main b { color:var(--gold); }
  .record { display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:7px 12px; font-size:13px; text-align:left; }
  .record .wl { font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .record .wl i { font-style:normal; color:var(--dim); font-weight:500; }
  .record .mid { flex:1; min-width:0; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .record .mid b { color:var(--ink); font-weight:600; }
  .record .chev { color:var(--dim); font-size:18px; line-height:1; }
  .pos { color:var(--go) !important; } .neg { color:var(--bad) !important; }
  .advice { flex:1 1 0; min-height:96px; background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--line); border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:4px 0 6px; }
  .advice .cap { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); min-height:13px; }
  .advice .big { font-size:clamp(60px, 17vh, 170px); font-weight:800; line-height:.92; color:var(--go); font-variant-numeric:tabular-nums; text-shadow:0 0 28px rgba(86,224,138,.25); }
  .advice.stay .big { color:var(--warn); font-size:clamp(30px, 7.5vh, 76px); line-height:1.05; text-align:center; text-shadow:none; }
  .advice.idle .big { color:var(--line); text-shadow:none; }
  .advice.over .big { color:var(--gold); font-size:clamp(40px, 9vh, 84px); text-shadow:none; }
  .advice .sub { font-size:15px; color:var(--dim); margin-top:4px; text-align:center; padding:0 10px; min-height:20px; }
  .advice .sub em { font-style:normal; color:var(--ink); font-weight:600; }
  .good { color:var(--go); font-weight:700; } .bad { color:var(--bad); font-weight:700; }
  .advice .recbtn { margin-top:8px; border:0; border-radius:999px; padding:9px 20px; font-size:15px; font-weight:700; background:var(--go); color:#06210f; }
  .heard { position:absolute; top:6px; left:12px; font-size:12px; color:var(--dim); }
  .heard b { color:var(--ink); font-size:15px; }
  .lat { position:absolute; top:6px; right:12px; font-size:11px; color:var(--dim); text-align:right; }
  .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .col { background:var(--felt); border:2px solid var(--line); border-radius:14px; padding:5px 5px 5px; text-align:center; position:relative; display:flex; flex-direction:column; transition:border-color .12s, background .12s; }
  .col.hit { border-color:var(--go); box-shadow:0 0 0 3px rgba(86,224,138,.12); } .col.stayhit { border-color:var(--warn); }
  .col.drop { border-color:var(--gold); background:#1c3226; }
  .colhead { display:flex; align-items:baseline; justify-content:space-between; padding:0 3px 3px; }
  .colhead .idx { font-size:11px; color:var(--dim); font-weight:700; }
  .colhead .tot { font-size:24px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; }
  .colhead .tot small { font-size:12px; color:var(--dim); font-weight:500; }
  .colhead .tot.close { color:var(--gold); }
  .stack { min-height:calc(var(--ch) * 2.8); display:flex; flex-direction:column; }
  .pcard { height:var(--ch); border-radius:8px; background:var(--card); color:var(--cardink); font-weight:800; font-size:calc(var(--ch) * .5); line-height:calc(var(--ch) * .6); text-align:left; padding:0 8px; box-shadow:0 -2px 6px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.12); touch-action:none; cursor:grab; position:relative; flex:none; }
  .pcard + .pcard { margin-top:calc(var(--ch) * -.4); }
  .pcard::after { content:attr(data-r); position:absolute; right:8px; bottom:0; font-size:calc(var(--ch) * .34); line-height:calc(var(--ch) * .5); opacity:.35; transform:rotate(180deg); }
  .pcard.new { box-shadow:0 0 0 3px var(--go), 0 -2px 6px rgba(0,0,0,.35); }
  .pcard.ghost { background:transparent; color:var(--dim); box-shadow:none; border:2px dashed var(--line); line-height:calc(var(--ch) - 4px); display:flex; justify-content:space-between; align-items:center; padding:0 6px; }
  .pcard.ghost::after { content:none; }
  .pcard.ghost span { font-size:11px; font-weight:700; }
  .pcard.lift { opacity:.25; }
  .dragclone { position:fixed; z-index:50; pointer-events:none; width:74px; transform:translate(-50%,-70%) rotate(-4deg) scale(1.08); box-shadow:0 10px 24px rgba(0,0,0,.55); margin:0 !important; }
  .staybtn { margin-top:5px; font-size:11px; font-weight:600; padding:4px 8px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--warn); }
  .staybtn[disabled] { visibility:hidden; }
  .hint { font-size:11px; color:var(--dim); text-align:center; margin:-2px 0; min-height:14px; }
  .hint.flash { color:var(--warn); font-weight:600; }
  .keys { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .key { position:relative; height:min(15vw, 8vh, 72px); border:0; border-radius:12px; background:var(--card); color:var(--cardink); font-size:26px; font-weight:800; box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .key:active { transform:translateY(2px); filter:brightness(.88); box-shadow:none; }
  .key u { position:absolute; left:7px; top:4px; text-decoration:none; font-size:11px; font-weight:600; color:#9aa79f; display:none; }
  @media (hover:hover) and (pointer:fine) { .key u { display:block; } }
  .key.w2 { grid-column:span 2; } .key.w3 { grid-column:span 3; }
  .key i { position:absolute; right:6px; top:4px; font-style:normal; font-size:12px; font-weight:600; color:#6b7a70; }
  .key.out { background:#243028; color:#4f5f55; box-shadow:none; } .key.out i { color:#4f5f55; }
  .key.util { background:var(--panel); color:var(--ink); font-size:14px; font-weight:600; border:1px solid var(--line); box-shadow:none; }
  .bar { display:flex; gap:6px; align-items:center; }
  .bar button { flex:1; min-width:0; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:13px; font-weight:600; }
  .bar button.on { background:#1d3b2a; border-color:var(--go); color:var(--go); }
  .bar button.err { border-color:var(--bad); color:var(--bad); }
  /* sheets */
  .scrim { position:fixed; inset:0; background:rgba(3,8,6,.72); z-index:80; display:none; align-items:flex-end; justify-content:center; }
  .scrim.open { display:flex; }
  .sheet { width:100%; max-width:560px; max-height:92dvh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-bottom:0; border-radius:20px 20px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 2px; font-size:20px; } .sheet .lead { color:var(--dim); font-size:13px; margin:0 0 12px; }
  .sheet h3 { margin:16px 0 8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  .frow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim); letter-spacing:.04em; text-transform:uppercase; }
  .field input, .field select { height:46px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:18px; font-weight:700; padding:0 10px; width:100%; min-width:0; user-select:text; -webkit-user-select:text; font-variant-numeric:tabular-nums; }
  .field select { font-size:15px; font-weight:600; }
  .field input:focus { outline:2px solid var(--go); outline-offset:-1px; }
  .wlbtns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .wlbtns button { height:58px; border-radius:14px; border:2px solid transparent; font-size:20px; font-weight:800; letter-spacing:.04em; }
  .bwin { background:#17432a; color:var(--go); border-color:#2a6b45 !important; } .bloss { background:#45201c; color:var(--bad); border-color:#70332d !important; }
  .bwin.sug { background:var(--go); color:#06210f; } .bloss.sug { background:var(--bad); color:#2a0703; }
  .ghostbtn { width:100%; height:42px; margin-top:8px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--dim); font-size:14px; font-weight:600; }
  .ghostbtn.danger { color:var(--bad); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tile { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center; }
  .tile b { display:block; font-size:19px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .tile span { font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); }
  .tile.wide { grid-column:span 3; display:flex; align-items:center; justify-content:space-between; padding:10px 14px; text-align:left; }
  .tile.wide b { font-size:26px; }
  .glist { display:flex; flex-direction:column; gap:4px; }
  .grow { display:grid; grid-template-columns:26px 1fr 1fr 70px 28px; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:6px 8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .grow .tag { font-weight:800; text-align:center; border-radius:6px; padding:2px 0; font-size:12px; }
  .grow .tag.W { background:#17432a; color:var(--go); } .grow .tag.L { background:#45201c; color:var(--bad); } .grow .tag.T { background:#2b2a17; color:var(--gold); } .grow .tag.P { background:#1f2a3a; color:#8fb8ff; }
  .wlbtns .bpend { grid-column:span 2; height:44px; font-size:14px; background:#1f2a3a; color:#8fb8ff; border-color:#35507a !important; }
  .pend { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; } .pend button { text-align:left; padding:9px 12px; border-radius:12px; border:1px solid #35507a; background:#1f2a3a; color:#8fb8ff; font-size:14px; font-weight:600; }
  .wlbtns .btie { grid-column:span 2; height:44px; font-size:15px; background:#2b2a17; color:var(--gold); border-color:#5a5223 !important; } .btie.sug { background:var(--gold); color:#221c02; }
  .grow small { color:var(--dim); display:block; font-size:10px; }
  .grow .amt { text-align:right; font-weight:700; }
  .grow button { border:0; background:transparent; color:var(--dim); font-size:16px; padding:4px; }
  .tiers { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:10px; }
  .tiers button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:6px 0 5px; font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tiers button small { display:block; font-size:9.5px; font-weight:500; color:var(--dim); }
  .tiers button.on { border-color:var(--gold); background:#2b2a17; color:var(--gold); }
  .bet { background:linear-gradient(180deg,#2b2a17,#1d2417); border:1px solid #5a5223; border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .bet .lbl { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .bet .amt { font-size:28px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; }
  .bet .amt small { font-size:14px; font-weight:600; color:var(--dim); }
  .bet ul { margin:6px 0 0; padding-left:18px; color:var(--dim); font-size:12.5px; line-height:1.45; }
  .bet ul b { color:var(--ink); }
  .advice .stake { margin-top:8px; border:1px solid #5a5223; background:#22230f; color:var(--gold); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:700; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--dim); }
  .chk input { width:20px; height:20px; accent-color:var(--go); }
  .srow { display:grid; grid-template-columns:1.5fr .8fr 1fr 1fr 1.1fr; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-size:13px; font-variant-numeric:tabular-nums; }
  .srow.head { background:transparent; border:0; padding:0 10px; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); }
  .srow.total { border-color:#5a5223; background:#22230f; font-weight:700; }
  .srow span:nth-child(n+2) { text-align:right; }
  .srow small { color:var(--dim); font-size:10px; display:block; font-weight:500; }
  .tile.wide > span { font-size:13px; text-transform:none; letter-spacing:0; }
  .tile i { font-style:normal; font-weight:700; }
  .bet .one { margin-top:2px; font-size:14px; color:var(--dim); } .bet .one b { color:var(--ink); }
  .bet .warn { margin-top:6px; font-size:13px; line-height:1.4; color:var(--dim); } .bet .warn b { color:var(--ink); }
  .bet details { margin-top:6px; } .bet summary { font-size:12px; color:var(--gold); font-weight:700; list-style:none; cursor:pointer; }
  .bet summary::-webkit-details-marker, .sec summary::-webkit-details-marker { display:none; }
  .sec { border-top:1px solid var(--line); margin-top:14px; } .sec + .sec { margin-top:0; }
  .sec summary { display:flex; justify-content:space-between; align-items:center; padding:15px 2px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); font-weight:700; list-style:none; cursor:pointer; }
  .sec summary::after { content:'+'; font-size:20px; font-weight:400; color:var(--dim); line-height:1; } .sec[open] summary::after { content:'–'; }
  .sec[open] { padding-bottom:14px; }
  .chart { margin-top:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px 4px; }
  .chart svg { display:block; width:100%; height:70px; }
  .chart div { display:flex; justify-content:space-between; font-size:10px; color:var(--dim); letter-spacing:.05em; text-transform:uppercase; padding-top:2px; }
  .mv { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .mv button { height:40px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px; font-weight:700; }
  .mvs { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:12.5px; color:var(--dim); } .mvs b { color:var(--ink); }
  .mvs button { border:0; background:transparent; color:var(--dim); font-size:12.5px; text-decoration:underline; padding:4px 0; }
  .tip { font-size:12px; color:var(--dim); margin:0 2px 8px; } .grow[data-ed] { cursor:pointer; }
  .tog { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  .boost { width:100%; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:13px; font-weight:700; letter-spacing:.04em; }
  .boost.on { border-color:var(--gold); background:#2b2a17; color:var(--gold); }
  .losetag { margin:0 0 6px; padding:6px 10px; border-radius:10px; background:#45201c; border:1px solid #70332d; color:var(--bad); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; }
  .boost.lose.on { border-color:#70332d; background:#45201c; color:var(--bad); }
  .empty { color:var(--dim); font-size:13px; text-align:center; padding:14px 0; }
</style>
</head>
<body class="inlobby">
  <div id="lobby">
    <div class="lobhead">
      <div><h1>21 Helper</h1><div class="lobsub" id="stLead"></div></div>
      <div class="lobrec"><span class="wl" id="rsWL"></span></div>
    </div>
    <div class="lobmid" id="rsMid"></div>
    <div class="lobmsg" id="lobMsg" style="display:none"></div>
    <div class="pend" id="pendBox"></div>
    <div id="betBox"></div>
    <button class="enter" id="enterBtn">Enter game</button>
    <button class="ghostbtn" id="newBtn" style="display:none">Start a new game instead</button>
    <button class="ghostbtn" id="stRecord" style="display:none;color:var(--ink)">Record result now</button>
    <div id="tiles"></div>
    <details class="sec"><summary>By day</summary><div class="glist" id="byDay"></div></details>
    <details class="sec"><summary>By bet</summary><div class="glist" id="byStake"></div></details>
    <details class="sec"><summary>More stats</summary><div class="tiles" id="more"></div></details>
    <details class="sec"><summary>Games</summary>
      <button class="ghostbtn" id="undoGame" style="margin:0 0 8px;color:var(--ink)">Undo last game</button>
      <div class="tip">Tap a game to edit or delete it. The small number is your balance after it.</div>
      <div class="glist" id="glist"></div>
      <button class="ghostbtn" id="stPast" style="color:var(--ink)">Add a past game</button></details>
    <details class="sec" id="setSec"><summary>Settings</summary>
    <div class="frow" style="grid-template-columns:1fr">
      <label class="field">Starting balance<input id="cStart" inputmode="decimal" autocomplete="off"></label>
    </div>
    <div class="field" style="margin-bottom:6px">Usual bet</div>
    <div class="tiers" id="cTiers"></div>
    <div class="frow">
      <label class="field">Entry fee<input id="cFee" inputmode="decimal" autocomplete="off"></label>
      <label class="field">Prize<input id="cPrize" inputmode="decimal" autocomplete="off"></label>
    </div>
    <div class="frow" style="grid-template-columns:1fr">
      <label class="field">Game length
        <select id="lenSel" aria-label="Game length">
          <option value="52">Full deck (52)</option><option value="45">Timer: ~45 cards</option>
          <option value="35">Timer: ~35 cards</option><option value="25">Timer: ~25 cards</option>
        </select></label>
    </div>
    <button class="ghostbtn danger" id="stReset">Erase all games</button></details>
  </div>

  <div id="game">
    <div class="stats">
      <div class="stat main"><b id="sScore">0</b><span>Score</span></div>
      <div class="stat"><b id="sLeft">52</b><span>Cards left</span></div>
      <div class="stat"><b id="sBusts">0/3</b><span>Busts</span></div>
      <div class="stat"><b id="sStays">2</b><span>Stays left</span></div>
    </div>

<script>
'use strict';
const POLICIES = /*POLICIES*/;
const CLIPS = /*CLIPS*/;
const E = TwentyOne, rules = E.DEFAULT_RULES, cfg = rules.cfg;
// One button per card value: 10, J, Q and K are the same card to the game, so they share the "10" button (16 copies).

// ------------------------------- game -------------------------------

function makePolicy() { policy = E.createSearcher(rules, POLICIES[horizonN] || POLICIES[52]); }
function replay(actions) {

// Lose mode: play normally up to a target picked between 2,400 and 3,800, then stop scoring and bust out,

const inLobby = () => document.body.classList.contains('inlobby');

// ------------------------------- drag a card to another column -------------------------------
let drag = null;

  }

}

document.addEventListener('pointerdown', (e) => {
  const c = e.target.closest && e.target.closest('.pcard[data-k]'); if (!c || drag) return;

document.addEventListener('pointercancel', (e) => endDrag(e, true));

// ------------------------------- record: wins, losses, opponent, balance -------------------------------
// games: [{t, my, opp|null, res:'W'|'L'|'T', fee, prize}]
let REC = Object.assign({ start: 0, fee: 0, prize: 0, risk: 0.25, games: [], moves: [] }, store.get('twentyone.record.v1', {}));
const TIERS = [[0.06, 0.1], [0.12, 0.2], [0.18, 0.3], [0.24, 0.4], [0.48, 0.8], [0.6, 1], [1.2, 2], [1.8, 3], [2.4, 4], [4.8, 8], [9.6, 16], [12, 20], [18, 30], [24, 40], [36, 60], [48, 80], [60, 100], [120, 200]];   // [entry fee, prize] as offered in the game's 1v1 mode
const amt = (x) => (x % 1 ? x.toFixed(2) : String(x));
// While a boost is switched on, a win pays 20% more on entries up to $9.60.
const BOOST = 1.2, BOOST_MAX = 9.6, r2 = (x) => Math.round(x * 100) / 100, BASE_TIERS = TIERS;
const boosted = (fee) => !!REC.boost && fee > 0 && fee <= BOOST_MAX + 1e-9;
const tiersNow = () => TIERS.map((t) => (boosted(t[0]) ? [t[0], r2(t[1] * BOOST)] : t));
function drawTiers(id, feeId, prizeId, after, plain) {
  const TIERS = plain ? BASE_TIERS : tiersNow();
  const fee = num($(feeId).value), prize = num($(prizeId).value);
  $(id).innerHTML = TIERS.map((t, i) => '<button data-i="' + i + '"' + (t[0] === fee && t[1] === prize ? ' class="on"' : '') + '>$' + amt(t[1]) + '<small>$' + amt(t[0]) + '</small></button>').join('');
  $(id).onclick = (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const t = TIERS[+b.dataset.i]; $(feeId).value = t[0]; $(prizeId).value = t[1]; drawTiers(id, feeId, prizeId, after, plain); if (after) after(t); };
}
const saveRec = () => store.set('twentyone.record.v1', REC);
const num = (s) => { const x = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return Number.isFinite(x) ? x : null; };

}

    n: G.length, w: W.length, l: L.length, t: G.filter((g) => g.res === 'T').length, pend: G.length - Rv.length, winPct: dec ? 100 * W.length / dec : null, oppPct: dec ? 100 * L.length / dec : null,
    myAvg: avg(G.map((g) => g.my)), oppAvg: avg(both.map((g) => g.opp)), margin: avg(both.map((g) => g.my - g.opp)),
    winMargin: avg(both.filter((g) => g.res === 'W').map((g) => g.my - g.opp)), lossMargin: avg(both.filter((g) => g.res === 'L').map((g) => g.opp - g.my)),
    avgWin: avg(W.map(delta)), avgLoss: avg(L.map((g) => -delta(g))), net, gnet: G.reduce((a, g) => a + delta(g), 0), adj: REC.moves.reduce((a, m) => a + (m.adj ? m.a : 0), 0), balance: REC.start + net + REC.moves.reduce((a, m) => a + (m.adj ? 0 : m.a), 0),

    best: G.length ? Math.max.apply(null, G.map((g) => g.my)) : null, oppBest: both.length ? Math.max.apply(null, both.map((g) => g.opp)) : null,

    oppSd: (() => { const o = both.map((g) => g.opp), m = avg(o); return o.length > 1 ? Math.sqrt(o.reduce((a, x) => a + (x - m) * (x - m), 0) / (o.length - 1)) : null; })(),
    oppAfterW: avg(G.filter((g, i) => i > 0 && g.opp != null && G[i - 1].res === 'W').map((g) => g.opp)),
    oppAfterL: avg(G.filter((g, i) => i > 0 && g.opp != null && G[i - 1].res === 'L').map((g) => g.opp)),

    breakEven: (() => { const P = G.filter((g) => g.prize > 0), f = P.reduce((a, g) => a + g.fee, 0), pr = P.reduce((a, g) => a + g.prize, 0); return pr ? 100 * f / pr : (REC.prize > 0 ? 100 * REC.fee / REC.prize : null); })(),

const CARD_WORDS = {

  ten: 9, tin: 9, tan: 9, tenn: 9, '10': 9,

for (const w in CARD_WORDS) if (CARD_WORDS[w] > 9) CARD_WORDS[w] = 9;   // jack, queen, king = the ten button

// Parse a transcript into commands. pending = the last word could still become a two-word

function parse(text, isFinal) {
  let words = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  // split digit runs like "78" into single cards (but keep "10")

  const cmds = []; let pending = false;
  for (let i = 0; i < words.length; i++) {
    const w = words[i], nx = words[i + 1];
    if (w === 'stay' || w === 'stays' || w === 'say') {
      if (nx === undefined) { pending = !isFinal; break; }
      if (nx in COL_WORDS) { cmds.push({ t: 'stay', col: COL_WORDS[nx] }); i++; } continue;
    }
    if (w === 'new' || w === 'knew') {
      if (nx === undefined) { pending = !isFinal; break; }
      if (nx === 'game' || nx === 'gain' || nx === 'came') { cmds.push({ t: 'new' }); i++; } continue;
    }
    if (w === 'newgame') { cmds.push({ t: 'new' }); continue; }
    if (w === 'undo' || w === 'undue' || w === 'undone') { cmds.push({ t: 'undo' }); continue; }
    if (w === 'and' && nx === 'do') { cmds.push({ t: 'undo' }); i++; continue; }

}
const cmdId = (c) => c.t + ':' + (c.t === 'card' ? c.r : c.t === 'stay' ? c.col : '');
function runCmd(c, tHeard) {   // returns true if it changed the game (and so can be reverted with undo)
  if (c.t === 'undo') { undo(); setHeard('undo'); return false; }
  if (c.t === 'new') { newGame(); setHeard('new game'); return false; }
  if (c.t === 'stay') { const ok = manualStay(c.col); setHeard('stay ' + (c.col + 1) + (ok ? '' : ' (not possible)')); return ok; }
  const res = playRank(c.r); setHeard(RANKS[c.r] + (res ? '' : ' (none left)'));
  if (res) speakMove(res.move, tHeard);
  return !!res;
}
function setHeard(s) { $('heard').innerHTML = 'heard <b>' + s + '</b>'; }
function isEcho(c) {
  if (!echoGuard) return false;
  const now = performance.now(), id = cmdId(c);
  echoGroups = echoGroups.filter((g) => g.until > now && g.left > 0);
  for (const g of echoGroups) if (now >= g.from && g.ids.indexOf(id) >= 0) { g.left--; return true; }

}
// Bring the game in line with the recognizer's current transcript for this session.
// Acts on interim text immediately; if the recognizer later changes its mind about a card,
// the wrong card is undone and the corrected one is played.
function reconcile(cmds, isFinal, tHeard) {
  let k = 0; while (k < ran.length && k < cmds.length && ran[k].id === cmdId(cmds[k])) k++;
  if (k < ran.length) {
    if (k === cmds.length && !isFinal) return;                 // interim text shrank: wait for it to settle
    const tail = ran.slice(k), oldLen = ran.length;
    if (tail.every((x) => x.rev)) { for (let j = tail.length - 1; j >= 0; j--) if (tail[j].did) undo(); ran.length = k; }
    else { ran.length = k; for (let j = k; j < oldLen && j < cmds.length; j++) ran.push({ id: cmdId(cmds[j]), rev: false, did: false }); }
  }
  for (let j = ran.length; j < cmds.length; j++) {
    const c = cmds[j], id = cmdId(c);
    if (isEcho(c)) { ran.push({ id, rev: true, did: false }); $('heard').innerHTML = 'heard my own voice (ignored)'; continue; }
    const did = runCmd(c, tHeard);
    ran.push({ id, rev: c.t === 'card' || c.t === 'stay', did });
  }
}

function speakMove(move, tHeard) {
  if (!actx || !voiceOn) return;
  if (actx.state !== 'running') { actx.resume().then(() => { if (actx.state === 'running') speakMove(move, tHeard); }).catch(() => {}); return; }
  const seq = move.stay >= 0 ? ['stay', WORDS[move.stay], 'then', WORDS[move.col]] : [WORDS[move.col]];
  let t = Math.max(actx.currentTime + 0.005, speakEnd + 0.12); const t0 = t;
  for (const name of seq) {
    const b = buffers[name]; if (!b) continue;
    const src = actx.createBufferSource(); src.buffer = b.buf; src.connect(actx.destination);
    src.start(t, b.lead); t += b.buf.duration - b.lead - b.tail + 0.03;
  }
  speakEnd = t;
  const now = performance.now(), startMs = now + (t0 - actx.currentTime) * 1000, endMs = now + (t - actx.currentTime) * 1000;
  echoGroups.push(move.stay >= 0
    ? { ids: ['stay:' + move.stay, 'card:' + move.stay, 'card:' + move.col], left: 2, from: startMs, until: endMs + 1500 }
    : { ids: ['card:' + move.col], left: 1, from: startMs, until: endMs + 1500 });
  if (tHeard) {
    const out = (actx.outputLatency || actx.baseLatency || 0) * 1000;
    let s = 'heard→sound ' + (startMs - tHeard + out).toFixed(0) + ' ms';
    if (meter && micEndT > micUsedT) {
      const full = startMs - micEndT + out; micUsedT = micEndT; lats.push(full);
      s += '<br>word end→sound ' + full.toFixed(0) + ' ms (n=' + lats.length + ', median ' + median(lats).toFixed(0) + ')';
      window.__lat = lats;
    }
    $('lat').innerHTML = s;
  }
}
const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

async function loadClips() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  if (actx.state !== 'running') await actx.resume();
  for (const name in CLIPS) {
    if (buffers[name]) continue;
    const bin = atob(CLIPS[name]), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const buf = await new Promise((ok, no) => actx.decodeAudioData(u8.buffer, ok, no));
    const d = buf.getChannelData(0); let a = 0, z = d.length - 1; // trim leading/trailing silence
    while (a < d.length && Math.abs(d[a]) < 0.02) a++; while (z > a && Math.abs(d[z]) < 0.02) z--;
    buffers[name] = { buf, lead: Math.max(0, a / buf.sampleRate - 0.005), tail: Math.max(0, (d.length - 1 - z) / buf.sampleRate - 0.02) };
  }
}
// Desktop only, with ?debug in the URL: watch the mic level to timestamp the end of each spoken word,
// so the page can show the true delay from end of word to start of the spoken answer.
async function startMeter() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const an = actx.createAnalyser(); an.fftSize = 512; actx.createMediaStreamSource(stream).connect(an);
    const buf = new Float32Array(an.fftSize); let floor = 0.004;
    const timer = setInterval(() => {
      an.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      const rms = Math.sqrt(s / buf.length); if (rms < floor * 3) floor = 0.99 * floor + 0.01 * rms;
      if (rms > Math.max(0.012, floor * 4) && actx.currentTime > speakEnd + 0.25) micEndT = performance.now();
    }, 8);

  } catch (e) { console.warn('meter', e); }
}
function stopMeter() { if (meter) { clearInterval(meter.timer); meter.stream.getTracks().forEach((t) => t.stop()); meter = null; } }
function killRec() { if (rec) { rec.onresult = rec.onerror = rec.onend = rec.onstart = null; try { rec.abort(); } catch (e) {} rec = null; } }
function startRec() {
  killRec();

  r.continuous = !IS_ANDROID;   // Android Chrome repeats the whole session text in continuous mode

    const tHeard = performance.now(); backoff = 250; fails = 0;
    let text = '', allFinal = true;
    for (let i = 0; i < e.results.length; i++) { text += ' ' + e.results[i][0].transcript; if (!e.results[i].isFinal) allFinal = false; }
    const p = parse(text, allFinal);

    lastErr = e.error;
    if ((e.error === 'not-allowed' || e.error === 'service-not-allowed') && document.visibilityState === 'visible') voiceFail('🎤 Mic blocked');

    if (rec !== r) return; rec = null;

function voiceFail(label) { setVoice(false); const b = $('voiceBtn'); b.classList.add('err'); b.textContent = label; }
async function setVoice(on) {
  const gen = ++voiceGen; voiceOn = on;
  const b = $('voiceBtn'); b.classList.toggle('on', on); b.classList.remove('err');

  $('echoBtn').style.display = on ? '' : 'none';
  if (on) {
    try { await loadClips(); } catch (e) { if (gen === voiceGen) voiceFail('🎤 Audio failed'); return; }
    if (gen !== voiceGen || !voiceOn) return;
    if (DEBUG && !IS_MOBILE && !meter) { await startMeter(); if (gen !== voiceGen || !voiceOn) { stopMeter(); return; } }
    backoff = 250; fails = 0; echoGroups = []; speakEnd = 0;

$('voiceBtn').onclick = () => {

$('echoBtn').onclick = () => { echoGuard = !echoGuard; $('echoBtn').textContent = echoGuard ? 'Speaker (echo guard on)' : 'Headphones (guard off)'; };
